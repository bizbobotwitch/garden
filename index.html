<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery of Babel Explorer</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --surface: #16161c;
      --border: #2a2a35;
      --text: #e8e6e3;
      --muted: #8a8794;
      --accent: #c9a227;
      --accent-hover: #dfb52e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.4rem;
    }

    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    /* Upload area */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(201, 162, 39, 0.05);
    }

    .upload-zone p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    #fileInput { display: none; }

    .btn-row {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-top: 1.1rem;
    }
